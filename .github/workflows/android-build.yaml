if not os.path.exists(prefs_path):
    print("  ✗ Prefs.kt not found")
    exit(0)

with open(prefs_path, 'r') as f:
    content = f.read()

# Add hasPromptedSetup property
property = """    var hasPromptedSetup: Boolean
        get() = sp.getBoolean("has_prompted_setup", false)
        set(value) = sp.edit().putBoolean("has_prompted_setup", value).apply()

"""

# Find location to insert (after class declaration or before a function)
if "hasPromptedSetup" not in content:
    # Try to insert after companion object or class declaration
    if "companion object" in content:
        new_content = re.sub(
            r'(companion object\s*\{)',
            r'\1\n' + property,
            content,
            count=1
        )
        if new_content != content:
            with open(prefs_path, 'w') as f:
                f.write(new_content)
            print("  ✓ Added hasPromptedSetup to Prefs.kt")
        else:
            print("  ⚠ Could not add hasPromptedSetup")
    else:
        print("  ⚠ companion object not found, skipping")
else:
    print("  ✓ hasPromptedSetup already exists")
