name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-heal known issues (no repo edits needed)
        shell: bash
        run: |
          set -e
          RES="app/src/main/res"
          KT="app/src/main/java/com/deltaatrbot/app"
          LAYOUT="$RES/layout/activity_main.xml"

          echo "== Fix 1: res-auto namespace typo =="
          FILES=$(grep -rl 'schemas.android.com/apk/res/auto' "$RES" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's#schemas\.android\.com/apk/res/auto#schemas.android.com/apk/res-auto#g'
            echo "  patched: $FILES"
          else
            echo "  already OK"
          fi

          echo "== Fix 2: repair missing layout_height attributes =="
          if [ -f "$LAYOUT" ]; then
            # Create a backup
            cp "$LAYOUT" "$LAYOUT.bak"
            
            # Fix 1: Add layout_height if missing (android:layout_height="wrap_content" as default)
            # This handles: android:layout_width="..." but no android:layout_height
            sed -i 's/\(android:layout_width="[^"]*"\)\s*\([^>]*\)>\s*$/&/' "$LAYOUT"
            
            # More robust: Find all View tags without layout_height and add it
            python3 << 'PYTHON_FIX'
import re
import os

xml_path = os.path.join("app/src/main/res/layout", "activity_main.xml")
if not os.path.exists(xml_path):
    print("  Layout file not found, skipping")
    exit(0)

with open(xml_path, 'r') as f:
    content = f.read()

# Find all View tags (including custom views, TextView, etc.) that lack layout_height
# Pattern matches <...View...> tags that don't have android:layout_height
# Simple approach: add layout_height to all views that are missing it

# Count how many views are missing layout_height
missing_heights = 0

# Parse line by line to preserve formatting better
lines = content.split('\n')
fixed_lines = []
in_view_tag = False
view_tag_content = ""

for line in lines:
    # Check if this line or previous lines contain a View tag opening
    if '<' in line and '>' not in line:
        # Multi-line tag, accumulate
        view_tag_content += line + '\n'
        continue
    
    if view_tag_content:
        view_tag_content += line + '\n'
        # Check if tag is complete
        if '>' in line:
            # Process the accumulated tag
            tag_text = view_tag_content
            view_tag_content = ""
            
            # Check if it's a View tag and missing layout_height
            if 'android:layout_width' in tag_text and 'android:layout_height' not in tag_text:
                # Only add if it's a View tag (not a closing tag or self-closing)
                if not tag_text.strip().startswith('</'):
                    # Add layout_height before the closing >
                    tag_text = tag_text.replace('>', ' android:layout_height="wrap_content">', 1)
                    missing_heights += 1
            fixed_lines.append(tag_text)
    else:
        # Normal single-line tag
        tag_text = line
        if 'android:layout_width' in tag_text and 'android:layout_height' not in tag_text:
            if '<' in tag_text and not tag_text.strip().startswith('</'):
                # Add layout_height before the closing >
                if '/>' in tag_text:
                    tag_text = tag_text.replace('/>', ' android:layout_height="wrap_content" />')
                elif '>' in tag_text:
                    tag_text = tag_text.replace('>', ' android:layout_height="wrap_content">')
                missing_heights += 1
        fixed_lines.append(tag_text)

new_content = '\n'.join(fixed_lines)

if missing_heights > 0:
    # Verify this actually changed something
    if new_content != content:
        with open(xml_path, 'w') as f:
            f.write(new_content)
        print(f"  Fixed {missing_heights} view(s) missing layout_height")
    else:
        print("  Found missing heights but couldn't apply fix, trying alternative...")
        # Alternative: Fallback to simple regex approach
        with open(xml_path, 'r') as f:
            content = f.read()
        # Add layout_height to views that have layout_width but not layout_height
        import re
        # Pattern for self-closing tags
        new_content = re.sub(
            r'(<[^>]*android:layout_width="[^"]*")([^>]*?)(/?>)',
            lambda m: m.group(1) + m.group(2) + ' android:layout_height="wrap_content" ' + m.group(3) 
                     if 'android:layout_height' not in m.group(0) else m.group(0),
            content
        )
        # Pattern for open tags with closing
        new_content = re.sub(
            r'(<[^>]*android:layout_width="[^"]*")([^>]*?)(>)',
            lambda m: m.group(1) + m.group(2) + ' android:layout_height="wrap_content" ' + m.group(3)
                     if 'android:layout_height' not in m.group(0) and not m.group(0).strip().startswith('</') else m.group(0),
            new_content
        )
        if new_content != content:
            with open(xml_path, 'w') as f:
                f.write(new_content)
            print("  Applied regex fallback fix")
        else:
            print("  WARNING: Could not automatically fix layout_height, check manually")
else:
    print("  All views already have layout_height")

PYTHON_FIX

            echo "  layout_height repair complete"
          else
            echo "  WARNING: activity_main.xml not found!"
          fi

          echo "== Fix 3: replace unreliable framework icons with bundled vectors =="
          mkdir -p "$RES/drawable"
          echo "" | base64 -d > "$RES/drawable/ic_settings_gear.xml"
          echo "" | base64 -d > "$RES/drawable/ic_visibility.xml"
          echo "  wrote ic_settings_gear.xml and ic_visibility.xml"

          if [ -f "$RES/layout/activity_main.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_manage#@drawable/ic_settings_gear#g' "$RES/layout/activity_main.xml"
          fi
          if [ -f "$RES/layout/activity_settings.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_view#@drawable/ic_visibility#g' "$RES/layout/activity_settings.xml"
          fi
          echo "  layout references repointed to bundled icons"

          echo "== Fix 4: avoid Settings auto-relaunch loop on every resume =="
          echo "== Fix 5: install on-device crash logger (writes crash_log.txt) =="
          mkdir -p "$KT"
          echo "" | base64 -d > "$KT/App.kt"
          echo "  wrote App.kt"

          echo "" | base64 -d > /tmp/patch_script.py
          python3 /tmp/patch_script.py

          echo "== Self-heal complete =="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-atr-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk