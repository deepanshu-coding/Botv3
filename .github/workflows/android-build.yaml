name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-heal all issues before build
        shell: bash
        run: |
          set -e
          
          RES="app/src/main/res"
          KT="app/src/main/java/com/deltaatrbot/app"
          LAYOUT="$RES/layout/activity_main.xml"
          
          echo "=========================================="
          echo "Starting self-healing process..."
          echo "=========================================="
          
          # ============================================
          # FIX 1: Fix res-auto namespace typo
          # ============================================
          echo ""
          echo "== Fix 1: res-auto namespace typo =="
          FILES=$(grep -rl 'schemas.android.com/apk/res/auto' "$RES" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's#schemas\.android\.com/apk/res/auto#schemas.android.com/apk/res-auto#g'
            echo "  ✓ patched: $FILES"
          else
            echo "  ✓ already OK"
          fi
          
          # ============================================
          # FIX 2: Fix missing layout_height attribute (CRASH FIX)
          # ============================================
          echo ""
          echo "== Fix 2: repair missing layout_height attributes =="
          if [ -f "$LAYOUT" ]; then
            cp "$LAYOUT" "$LAYOUT.bak"
            
            python3 << 'PYTHON_FIX'
import re
import os

xml_path = "app/src/main/res/layout/activity_main.xml"
if not os.path.exists(xml_path):
    print("  ✗ Layout file not found")
    exit(0)

with open(xml_path, 'r') as f:
    content = f.read()

def add_layout_height_to_tag(tag):
    """Add layout_height to a view tag if missing"""
    if 'android:layout_height' in tag:
        return tag
    if 'android:layout_width' not in tag:
        return tag
    if tag.strip().startswith('</'):
        return tag
    
    # Add layout_height before closing
    if '/>' in tag:
        return tag.replace('/>', ' android:layout_height="wrap_content" />')
    elif '>' in tag:
        return tag.replace('>', ' android:layout_height="wrap_content">')
    return tag

# Process line by line
lines = content.split('\n')
fixed_lines = []
multiline_buffer = []
in_multiline = False
fixed_count = 0

for line in lines:
    if '<' in line and '>' not in line:
        # Start of multiline tag
        multiline_buffer.append(line)
        in_multiline = True
        continue
    
    if in_multiline:
        multiline_buffer.append(line)
        if '>' in line:
            # End of multiline tag
            full_tag = '\n'.join(multiline_buffer)
            if 'android:layout_width' in full_tag and 'android:layout_height' not in full_tag:
                if not full_tag.strip().startswith('</'):
                    # Add layout_height to the last line before closing
                    last_line_index = len(multiline_buffer) - 1
                    last_line = multiline_buffer[last_line_index]
                    if '/>' in last_line:
                        multiline_buffer[last_line_index] = last_line.replace('/>', ' android:layout_height="wrap_content" />')
                    elif '>' in last_line:
                        multiline_buffer[last_line_index] = last_line.replace('>', ' android:layout_height="wrap_content">')
                    fixed_count += 1
            fixed_lines.extend(multiline_buffer)
            multiline_buffer = []
            in_multiline = False
        continue
    
    # Single line tag
    if 'android:layout_width' in line and 'android:layout_height' not in line:
        if '<' in line and not line.strip().startswith('</'):
            if '/>' in line:
                line = line.replace('/>', ' android:layout_height="wrap_content" />')
            elif '>' in line:
                line = line.replace('>', ' android:layout_height="wrap_content">')
            fixed_count += 1
    fixed_lines.append(line)

new_content = '\n'.join(fixed_lines)

if fixed_count > 0 and new_content != content:
    with open(xml_path, 'w') as f:
        f.write(new_content)
    print(f"  ✓ Fixed {fixed_count} view(s) missing layout_height")
elif fixed_count == 0:
    print("  ✓ All views already have layout_height")
else:
    print("  ⚠ WARNING: Could not fix layout_height, trying fallback...")
    
    # Fallback: simple regex
    with open(xml_path, 'r') as f:
        content = f.read()
    
    pattern = r'(<[^>]*android:layout_width="[^"]*")((?:(?!android:layout_height)[^>])*?)(/?>)'
    new_content = re.sub(
        pattern,
        lambda m: m.group(1) + m.group(2) + ' android:layout_height="wrap_content" ' + m.group(3)
                 if 'android:layout_height' not in m.group(0) else m.group(0),
        content,
        flags=re.DOTALL
    )
    
    if new_content != content:
        with open(xml_path, 'w') as f:
            f.write(new_content)
        print("  ✓ Applied regex fallback fix")
    else:
        print("  ✗ ERROR: Could not fix layout_height, check manually")
PYTHON_FIX

          else
            echo "  ✗ WARNING: activity_main.xml not found!"
          fi
          
          # ============================================
          # FIX 3: Replace unreliable framework icons
          # ============================================
          echo ""
          echo "== Fix 3: replace unreliable framework icons with bundled vectors =="
          mkdir -p "$RES/drawable"
          
          # ic_settings_gear.xml
          echo '' | base64 -d > "$RES/drawable/ic_settings_gear.xml"
          
          # ic_visibility.xml
          echo '' | base64 -d > "$RES/drawable/ic_visibility.xml"
          
          echo "  ✓ wrote ic_settings_gear.xml and ic_visibility.xml"
          
          # Update layout references
          if [ -f "$RES/layout/activity_main.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_manage#@drawable/ic_settings_gear#g' "$RES/layout/activity_main.xml"
          fi
          if [ -f "$RES/layout/activity_settings.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_view#@drawable/ic_visibility#g' "$RES/layout/activity_settings.xml"
          fi
          echo "  ✓ layout references repointed to bundled icons"
          
          # ============================================
          # FIX 4: Add crash logging App.kt
          # ============================================
          echo ""
          echo "== Fix 4: install on-device crash logger =="
          mkdir -p "$KT"
          
          echo '' | base64 -d > "$KT/App.kt"
          
          echo "  ✓ wrote App.kt"
          
          # ============================================
          # FIX 5: Register App class in manifest
          # ============================================
          echo ""
          echo "== Fix 5: register App class in manifest =="
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android:name=".App"' "$MANIFEST"; then
              sed -i 's/<application /<application android:name=".App" /' "$MANIFEST"
              echo "  ✓ registered App class in manifest"
            else
              echo "  ✓ already registered"
            fi
          else
            echo "  ✗ Manifest not found"
          fi
          
          # ============================================
          # FIX 6: Fix auto-relaunch loop in MainActivity
          # ============================================
          echo ""
          echo "== Fix 6: fix auto-relaunch loop =="
          MAIN_ACTIVITY="$KT/MainActivity.kt"
          if [ -f "$MAIN_ACTIVITY" ]; then
            # Backup original
            cp "$MAIN_ACTIVITY" "$MAIN_ACTIVITY.bak"
            
            # Create Python script to fix the loop
            python3 << 'PYTHON_FIX_MAIN'
import re
import os

main_path = "app/src/main/java/com/deltaatrbot/app/MainActivity.kt"
if not os.path.exists(main_path):
    print("  ✗ MainActivity.kt not found")
    exit(0)

with open(main_path, 'r') as f:
    content = f.read()

# Pattern to find the problematic block
pattern = r'if\s*\(!prefs\.isConfigured\(\)\)\s*\{[^}]*startActivity\(Intent\(this,\s*SettingsActivity::class\.java\)\)[^}]*return\s*\}'

replacement = '''if (!prefs.isConfigured()) {
            subtitleText.text = "Not configured - tap the gear icon to set your Backend URL"
            setStatusPill("Not configured", R.drawable.bg_pill_gray, R.color.carbon_text_muted)
            if (!prefs.hasPromptedSetup) {
                prefs.hasPromptedSetup = true
                startActivity(Intent(this, SettingsActivity::class.java))
            }
            return
        }'''

# Check if the pattern exists and replace
if re.search(pattern, content, re.DOTALL):
    new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
    if new_content != content:
        with open(main_path, 'w') as f:
            f.write(new_content)
        print("  ✓ Fixed auto-relaunch loop")
    else:
        print("  ⚠ Pattern matched but replacement failed")
else:
    # Try alternative pattern
    pattern2 = r'if\s*\(!prefs\.isConfigured\(\)\)\s*\{[^}]*startActivity\([^)]*SettingsActivity[^)]*\)[^}]*return\s*\}'
    if re.search(pattern2, content, re.DOTALL):
        new_content = re.sub(pattern2, replacement, content, flags=re.DOTALL)
        if new_content != content:
            with open(main_path, 'w') as f:
                f.write(new_content)
            print("  ✓ Fixed auto-relaunch loop (alternative pattern)")
        else:
            print("  ⚠ Pattern matched but replacement failed")
    else:
        print("  ✓ No auto-relaunch loop found or already fixed")
PYTHON_FIX_MAIN

          else
            echo "  ✗ MainActivity.kt not found"
          fi
          
          # ============================================
          # FIX 7: Add hasPromptedSetup to Prefs.kt
          # ============================================
          echo ""
          echo "== Fix 7: add hasPromptedSetup to Prefs.kt =="
          PREFS="$KT/Prefs.kt"
          if [ -f "$PREFS" ]; then
            if ! grep -q "hasPromptedSetup" "$PREFS"; then
              # Find the right place to add the property
              python3 << 'PYTHON_FIX_PREFS'
