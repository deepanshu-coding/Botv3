name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-heal issues before build
        shell: bash
        run: |
          set -e
          RES="app/src/main/res"
          KT="app/src/main/java/com/deltaatrbot/app"
          LAYOUT="$RES/layout/activity_main.xml"

          echo "== Fix 1: res-auto namespace typo =="
          FILES=$(grep -rl 'schemas.android.com/apk/res/auto' "$RES" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's#schemas\.android\.com/apk/res/auto#schemas.android.com/apk/res-auto#g'
            echo "  patched: $FILES"
          else
            echo "  already OK"
          fi

          echo "== Fix 2: repair missing layout_height =="
          if [ -f "$LAYOUT" ]; then
            cp "$LAYOUT" "$LAYOUT.bak"
            python3 << 'PYTHON_FIX'
          import re
          import os
          xml_path = "app/src/main/res/layout/activity_main.xml"
          if not os.path.exists(xml_path):
              print("  Layout file not found")
              exit(0)
          with open(xml_path, 'r') as f:
              content = f.read()
          lines = content.split('\n')
          fixed_lines = []
          multiline_buffer = []
          in_multiline = False
          fixed_count = 0
          for line in lines:
              if '<' in line and '>' not in line:
                  multiline_buffer.append(line)
                  in_multiline = True
                  continue
              if in_multiline:
                  multiline_buffer.append(line)
                  if '>' in line:
                      full_tag = '\n'.join(multiline_buffer)
                      if 'android:layout_width' in full_tag and 'android:layout_height' not in full_tag:
                          if not full_tag.strip().startswith('</'):
                              last_line_index = len(multiline_buffer) - 1
                              last_line = multiline_buffer[last_line_index]
                              if '/>' in last_line:
                                  multiline_buffer[last_line_index] = last_line.replace('/>', ' android:layout_height="wrap_content" />')
                              elif '>' in last_line:
                                  multiline_buffer[last_line_index] = last_line.replace('>', ' android:layout_height="wrap_content">')
                              fixed_count += 1
                      fixed_lines.extend(multiline_buffer)
                      multiline_buffer = []
                      in_multiline = False
                  continue
              if 'android:layout_width' in line and 'android:layout_height' not in line:
                  if '<' in line and not line.strip().startswith('</'):
                      if '/>' in line:
                          line = line.replace('/>', ' android:layout_height="wrap_content" />')
                      elif '>' in line:
                          line = line.replace('>', ' android:layout_height="wrap_content">')
                      fixed_count += 1
              fixed_lines.append(line)
          new_content = '\n'.join(fixed_lines)
          if fixed_count > 0 and new_content != content:
              with open(xml_path, 'w') as f:
                  f.write(new_content)
              print(f"  Fixed {fixed_count} view(s) missing layout_height")
          else:
              print("  No layout_height issues found")
          PYTHON_FIX
          else
            echo "  WARNING: activity_main.xml not found!"
          fi

          echo "== Fix 3: bundled icons =="
          mkdir -p "$RES/drawable"
          echo 'PHZlY3RvciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiCiAgICBhbmRyb2lkOndpZHRoPSIyNGRwIgogICAgYW5kcm9pZDpoZWlnaHQ9IjI0ZHAiCiAgICBhbmRyb2lkOnZpZXdwb3J0[...]'
          echo 'PHZlY3RvciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiCiAgICBhbmRyb2lkOndpZHRoPSIyNGRwIgogICAgYW5kcm9pZDpoZWlnaHQ9IjI0ZHAiCiAgICBhbmRyb2lkOnZpZXdwb3J0[...]'
          echo "  wrote icons"

          echo "== Fix 4: crash logger =="
          mkdir -p "$KT"
          echo 'cGFja2FnZSBjb20uZGVsdGFhdHJib3QuYXBwCgppbXBvcnQgYW5kcm9pZC5hcHAuQXBwbGljYXRpb24KaW1wb3J0IGphdmEuaW8uRmlsZQppbXBvcnQgamF2YS5pby5QcmludFdyaXRlcgppbXBvcnQgamF2YS5pby5TdHJpbmdXcml0ZXIKaW1w[...]'
          echo "  wrote App.kt"

          echo "== Fix 5: register App in manifest =="
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android:name=".App"' "$MANIFEST"; then
              sed -i 's/<application /<application android:name=".App" /' "$MANIFEST"
              echo "  registered"
            else
              echo "  already registered"
            fi
          fi

          echo "Self-healing complete!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-atr-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
