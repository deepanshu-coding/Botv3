name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-heal known issues (no repo edits needed)
        shell: bash
        run: |
          set -e
          RES="app/src/main/res"
          KT="app/src/main/java/com/deltaatrbot/app"

          echo "== Fix 1: res-auto namespace typo =="
          FILES=$(grep -rl 'schemas.android.com/apk/res/auto' "$RES" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's#schemas\.android\.com/apk/res/auto#schemas.android.com/apk/res-auto#g'
            echo "  patched: $FILES"
          else
            echo "  already OK"
          fi

          echo "== Fix 2: replace unreliable framework icons with bundled vectors =="
          mkdir -p "$RES/drawable"
          echo "" | base64 -d > "$RES/drawable/ic_settings_gear.xml"
          echo "" | base64 -d > "$RES/drawable/ic_visibility.xml"
          echo "  wrote ic_settings_gear.xml and ic_visibility.xml"

          if [ -f "$RES/layout/activity_main.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_manage#@drawable/ic_settings_gear#g' "$RES/layout/activity_main.xml"
          fi
          if [ -f "$RES/layout/activity_settings.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_view#@drawable/ic_visibility#g' "$RES/layout/activity_settings.xml"
          fi
          echo "  layout references repointed to bundled icons"

          echo "== Fix 3: avoid Settings auto-relaunch loop on every resume =="
          echo "== Fix 4: install on-device crash logger (writes crash_log.txt) =="
          mkdir -p "$KT"
          echo "" | base64 -d > "$KT/App.kt"
          echo "  wrote App.kt"

          echo "" | base64 -d > /tmp/patch_script.py
          python3 /tmp/patch_script.py

          echo "== Self-heal complete =="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-atr-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
