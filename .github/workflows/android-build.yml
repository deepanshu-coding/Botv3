name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-heal known issues (no repo edits needed)
        shell: bash
        run: |
          set -e
          RES=app/src/main/res
          KT=app/src/main/java/com/deltaatrbot/app

          echo "== Fix 1: res-auto namespace typo =="
          # "http://schemas.android.com/apk/res/auto" (slash) is invalid.
          # Correct URI is "http://schemas.android.com/apk/res-auto" (hyphen).
          # Wrong URI silently breaks resolution of every app: attribute
          # (app:tint, app:strokeColor, ...), failing resource linking.
          FILES=$(grep -rl 'schemas.android.com/apk/res/auto' "$RES" 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's#schemas\.android\.com/apk/res/auto#schemas.android.com/apk/res-auto#g'
            echo "  patched: $FILES"
          else
            echo "  already OK"
          fi

          echo "== Fix 2: replace unreliable framework icons with bundled vectors =="
          # @android:drawable/ic_menu_manage and ic_menu_view are internal
          # framework resources not guaranteed present across all OS
          # versions/OEM builds. If they fail to resolve, setContentView()
          # throws Resources.NotFoundException immediately on launch - a
          # crash on every open. Bundle our own vector icons instead.

          mkdir -p "$RES/drawable"

          cat > "$RES/drawable/ic_settings_gear.xml" << 'SVGEOF'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp"
    android:height="24dp"
    android:viewportWidth="24"
    android:viewportHeight="24"
    android:tint="#FFFFFF">
    <path
        android:fillColor="#FF000000"
        android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35c-0.59,0.24 -1.13,0.57 -1.62,0.94L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z" />
</vector>
SVGEOF

          cat > "$RES/drawable/ic_visibility.xml" << 'SVGEOF'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp"
    android:height="24dp"
    android:viewportWidth="24"
    android:viewportHeight="24"
    android:tint="#FFFFFF">
    <path
        android:fillColor="#FF000000"
        android:pathData="M12,4.5C7,4.5 2.73,7.61 1,12c1.73,4.39 6,7.5 11,7.5s9.27,-3.11 11,-7.5C21.27,7.61 17,4.5 12,4.5zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5s5,2.24 5,5S14.76,17 12,17zM12,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3s3,-1.34 3,-3S13.66,9 12,9z" />
</vector>
SVGEOF

          echo "  wrote ic_settings_gear.xml and ic_visibility.xml"

          if [ -f "$RES/layout/activity_main.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_manage#@drawable/ic_settings_gear#g' "$RES/layout/activity_main.xml"
          fi
          if [ -f "$RES/layout/activity_settings.xml" ]; then
            sed -i 's#@android:drawable/ic_menu_view#@drawable/ic_visibility#g' "$RES/layout/activity_settings.xml"
          fi
          echo "  layout references repointed to bundled icons"

          echo "== Fix 3: avoid Settings auto-relaunch loop on every resume =="
          # Old MainActivity.onResume() auto-launched SettingsActivity on
          # EVERY resume while unconfigured. Pressing Back from Settings
          # without saving would immediately bounce right back into
          # Settings - looks exactly like the app "closing immediately".
          # Patch is idempotent: only applies if the old code is found.
          PREFS_FILE="$KT/Prefs.kt"
          MAIN_FILE="$KT/MainActivity.kt"

          if [ -f "$PREFS_FILE" ] && ! grep -q "hasPromptedSetup" "$PREFS_FILE"; then
            python3 - "$PREFS_FILE" << 'PYEOF'
import sys
path = sys.argv[1]
with open(path, "r") as f:
    content = f.read()

anchor = "    fun isConfigured(): Boolean = backendUrl.isNotBlank()"
insert = (
    "    var hasPromptedSetup: Boolean\n"
    "        get() = sp.getBoolean(\"has_prompted_setup\", false)\n"
    "        set(value) = sp.edit().putBoolean(\"has_prompted_setup\", value).apply()\n\n"
    + anchor
)
if anchor in content and "hasPromptedSetup" not in content:
    content = content.replace(anchor, insert, 1)
    with open(path, "w") as f:
        f.write(content)
    print("  Prefs.kt: added hasPromptedSetup")
else:
    print("  Prefs.kt: anchor not found or already patched, skipped")
PYEOF
          else
            echo "  Prefs.kt: already has hasPromptedSetup or file missing, skipped"
          fi

          if [ -f "$MAIN_FILE" ] && grep -q "startActivity(Intent(this, SettingsActivity::class.java))" "$MAIN_FILE" && ! grep -q "hasPromptedSetup" "$MAIN_FILE"; then
            python3 - "$MAIN_FILE" << 'PYEOF'
import sys, re
path = sys.argv[1]
with open(path, "r") as f:
    content = f.read()

pattern = re.compile(
    r'if \(!prefs\.isConfigured\(\)\) \{[^}]*?startActivity\(Intent\(this, SettingsActivity::class\.java\)\)\s*\n\s*return\s*\n\s*\}',
    re.DOTALL
)
replacement = (
    "if (!prefs.isConfigured()) {\n"
    "            subtitleText.text = \"Not configured - tap the gear icon to set your Backend URL\"\n"
    "            setStatusPill(\"Not configured\", R.drawable.bg_pill_gray, R.color.carbon_text_muted)\n"
    "            if (!prefs.hasPromptedSetup) {\n"
    "                prefs.hasPromptedSetup = true\n"
    "                startActivity(Intent(this, SettingsActivity::class.java))\n"
    "            }\n"
    "            return\n"
    "        }"
)
new_content, n = pattern.subn(replacement, content, count=1)
if n > 0:
    with open(path, "w") as f:
        f.write(new_content)
    print("  MainActivity.kt: patched onResume loop")
else:
    print("  MainActivity.kt: pattern not found, skipped (manual review may be needed)")
PYEOF
          else
            echo "  MainActivity.kt: already patched or pattern absent, skipped"
          fi

          echo "== Self-heal complete =="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-atr-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
